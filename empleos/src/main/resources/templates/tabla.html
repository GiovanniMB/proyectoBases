<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
	<head>
		<meta charset="ISO-8859-1">
		<title>Listado de Vacantes</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
	</head>
	<body>
		<img th:src="@{/imagenes/logo.png}" width="136" height="136">
		<h1 class="text-primary">Lista de Vacantes</h1>
		
		<table class="table table-striped table-bordered table-hover">
	  		<thead>
			    <tr>
			      <th>Logo</th>
			      <th>Id</th>
			      <th>Nombre</th>
			      <th>Fecha Publicacion</th>
			      <th>Salario Ofrecido</th>
			      <th>Descripcion</th>
			      <th>Destacada</th>
			      <th>Detalle</th>
			      <th>Borrar</th>
			    </tr>
	  		</thead>
	  		<tbody>
			    <tr th:each="vacante: ${vacantes}">
			    	  <td>
			    	  	<img th:src="@{/imagenes/{img} (img = ${vacante.imagen} ) }" width="126" height="136">
			    	  </td>
				      <td th:text="${vacante.id}"></td>
				      <td th:text="${vacante.nombre}"></td>
				      <td th:text="${vacante.fecha}"></td>
				      <td th:text="${vacante.salario}"></td>
				      <td th:text="${vacante.descripcion}"></td>
				      <!-- 
				      <td th:text="${vacante.destacado}"></td>
				      <td th:text="${vacante.destacado == 1 ? 'Si' : 'No'}"></td>
				      -->
				      <td>
				      	<span th:if="${vacante.destacado == 1}" class="badge text-bg-success">Si</span>
				      	<span th:unless="${vacante.destacado == 1}" class="badge text-bg-danger">No</span>
				      </td>
				      <td>
				      		<a th:href="@{/vacantes/view/{id} (id=${vacante.id}) }" class="btn btn-success">Detalle</a>
				      </td>
				      <td>
				      		<a th:href="@{/vacantes/delete(id=${vacante.id}) }"href="#" class="btn btn-danger">Borrar</a>
				      </td>
			    </tr>
	  		</tbody>
		</table>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
	</body>
</html>
